name: Generate Video Thumbnails

on:
  workflow_dispatch:
  push:
    paths:
      - "videos.json"

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Create thumbnail folder
        run: |
          mkdir -p thumbnails

      - name: Generate middle-frame thumbnails
        shell: bash
        run: |

          jq -c '.[]' videos.json | while read video
          do

            ID=$(echo "$video" | jq -r '.id')
            URL=$(echo "$video" | jq -r '.url')

            echo "Processing Video ID: $ID"

            curl -L \
              --fail \
              --retry 3 \
              --connect-timeout 20 \
              --max-time 600 \
              "$URL" \
              -o "/tmp/video_$ID.mp4"

            DURATION=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "/tmp/video_$ID.mp4")

            echo "Duration: $DURATION seconds"

            MIDDLE=$(awk "BEGIN {print $DURATION / 2}")

            echo "Middle frame: $MIDDLE seconds"

            ffmpeg \
              -y \
              -ss "$MIDDLE" \
              -i "/tmp/video_$ID.mp4" \
              -frames:v 1 \
              -vf "scale=640:-2" \
              -q:v 2 \
              "thumbnails/$ID.jpg"

            rm -f "/tmp/video_$ID.mp4"

          done

      - name: Commit thumbnails
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add thumbnails/

          if git diff --cached --quiet; then
            echo "No thumbnails to commit."
          else
            git commit -m "Generate video thumbnails"
            git push
          fi
