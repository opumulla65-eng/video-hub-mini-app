<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0713">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>P**** Video Hub</title>

<style>
:root{
  --bg:#08060d;
  --panel:#120d1d;
  --panel2:#181126;
  --line:rgba(255,255,255,.09);
  --text:#fff;
  --muted:#aaa1b7;
  --accent:#c84cff;
  --accent2:#7b2cff;
  --danger:#ff4d8d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;padding-bottom:78px}
button,input{font:inherit}
button{border:0;cursor:pointer;color:inherit}
img{max-width:100%;display:block}

/* HEADER */
.header{
  position:sticky;top:0;z-index:50;
  height:64px;padding:8px 14px;
  display:flex;align-items:center;gap:12px;
  background:rgba(8,6,13,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)
}
.logo{
  width:46px;height:46px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(220,90,255,.65);
  box-shadow:0 0 18px rgba(200,76,255,.35)
}
.brand{font-size:18px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.header-spacer{flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:19px
}

/* MAIN */
.container{width:min(1180px,100%);margin:auto;padding:14px}

/* LATEST */
.latest{
  position:relative;overflow:hidden;border-radius:22px;
  min-height:250px;
  background:#110b19;
  border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(0,0,0,.35);
  margin-bottom:16px
}
.latest-media{position:absolute;inset:0;background:#050407}
.latest-media img,.latest-media video{
  width:100%;height:100%;object-fit:cover
}
.latest-shade{
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.52) 46%,rgba(0,0,0,.16) 100%),
             linear-gradient(0deg,rgba(0,0,0,.78),transparent 55%)
}
.latest-content{
  position:relative;z-index:2;min-height:250px;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:22px
}
.badge{
  width:max-content;padding:6px 10px;border-radius:999px;
  background:rgba(200,76,255,.18);border:1px solid rgba(200,76,255,.4);
  color:#f0c8ff;font-size:11px;font-weight:800;text-transform:uppercase
}
.latest h1{font-size:25px;line-height:1.15;margin:9px 0 7px;max-width:650px}
.latest p{margin:0 0 14px;color:#d0c9d7;font-size:13px;max-width:620px}
.play-main{
  width:max-content;padding:11px 18px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:800;box-shadow:0 8px 24px rgba(123,44,255,.3)
}

/* CATEGORIES */
.categories{
  display:flex;gap:8px;overflow-x:auto;padding:3px 0 13px;
  scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;padding:9px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  color:#c4bdca;font-size:13px;font-weight:700
}
.cat.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}

/* SEARCH */
.search-wrap{display:none;margin:0 0 14px}
.search-wrap.show{display:block}
.search{
  width:100%;height:46px;padding:0 15px;border-radius:13px;
  background:var(--panel);border:1px solid var(--line);outline:none;color:#fff
}
.search:focus{border-color:rgba(200,76,255,.7)}

/* SECTION */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.section-head h2{font-size:18px;margin:0}
.section-head span{font-size:12px;color:var(--muted)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{
  overflow:hidden;background:var(--panel);
  border:1px solid var(--line);border-radius:15px
}
.thumb{
  position:relative;aspect-ratio:16/10;background:#0d0913;overflow:hidden
}
.thumb img,.thumb video{
  width:100%;height:100%;object-fit:cover
}
.thumb video{display:block}
.thumb-fallback{
  position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#2a183b,#0c0811 70%);
  color:#bca9c9;font-size:35px
}
.thumb-fallback.hidden{display:none}
.duration{
  position:absolute;right:7px;bottom:7px;padding:3px 6px;
  border-radius:5px;background:rgba(0,0,0,.78);font-size:10px
}
.card-body{padding:10px}
.title{
  font-size:13px;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.meta{font-size:10px;color:var(--muted);margin-top:5px}
.empty{
  grid-column:1/-1;text-align:center;padding:35px 15px;
  color:var(--muted);background:var(--panel);border-radius:15px;border:1px solid var(--line)
}

/* PLAYER MODAL */
.player-modal{
  position:fixed;inset:0;z-index:200;display:none;
  background:#000
}
.player-modal.open{display:flex;flex-direction:column}
.player-top{
  height:58px;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:rgba(8,6,13,.95);
  border-bottom:1px solid rgba(255,255,255,.08);flex:0 0 auto
}
.close-player{
  width:40px;height:40px;border-radius:50%;background:#17131e;font-size:22px
}
.player-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-area{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  background:#000;padding:0
}
#mainVideo{
  display:block;width:100%;height:auto;max-height:calc(100vh - 150px);
  background:#000;object-fit:contain
}
.player-info{
  flex:0 0 auto;padding:10px 14px 14px;
  background:#0d0912;border-top:1px solid rgba(255,255,255,.08)
}
.player-actions{display:flex;gap:8px;flex-wrap:wrap}
.action{
  padding:8px 12px;border-radius:10px;background:#18121f;
  border:1px solid var(--line);font-size:12px
}
.action.active{color:#ff72b0;border-color:rgba(255,114,176,.4)}
.player-desc{color:var(--muted);font-size:12px;margin:8px 0 0;line-height:1.45}

/* NATIVE VIDEO CONTROLS + BIG FULLSCREEN */
#mainVideo::-webkit-media-controls-enclosure{width:100%}
#mainVideo:fullscreen{width:100vw;height:100vh;max-height:none;object-fit:contain;background:#000}
#mainVideo:-webkit-full-screen{width:100vw;height:100vh;max-height:none;object-fit:contain;background:#000}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;height:68px;z-index:80;
  display:flex;justify-content:space-around;align-items:center;
  background:rgba(10,7,15,.96);backdrop-filter:blur(15px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
}
.nav-item{background:none;color:#91899a;font-size:11px;text-align:center;padding:5px 14px}
.nav-item b{display:block;font-size:19px;margin-bottom:3px}
.nav-item.active{color:#e58aff}

/* PROFILE */
.profile{
  display:none;position:fixed;inset:0;z-index:150;
  background:var(--bg);padding:80px 16px 90px;overflow:auto
}
.profile.open{display:block}
.profile-card{
  max-width:520px;margin:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:22px
}
.profile-logo{width:92px;height:92px;border-radius:50%;margin:0 auto 14px;border:2px solid rgba(200,76,255,.55)}
.profile h2{text-align:center;margin:0 0 5px}
.profile p{text-align:center;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}
.stat{background:var(--panel2);border-radius:13px;padding:15px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}

/* DESKTOP */
@media(min-width:800px){
  .container{padding:20px}
  .latest{min-height:390px}
  .latest-content{min-height:390px;padding:34px}
  .latest h1{font-size:34px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .bottom-nav{left:50%;transform:translateX(-50%);width:min(600px,100%);border-radius:18px 18px 0 0}
}

/* SMALL PHONES */
@media(max-width:380px){
  .grid{gap:8px}.card-body{padding:8px}.title{font-size:12px}
  .latest h1{font-size:21px}
}
</style>
</head>

<body>

<header class="header">
  <img id="appLogo" class="logo" alt="App Logo">
  <div class="brand">P**** Video Hub<small>Premium Video Hub</small></div>
  <div class="header-spacer"></div>
  <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
</header>

<main class="container" id="homePage">

  <section class="latest" id="latestSection">
    <div class="latest-media" id="latestMedia"></div>
    <div class="latest-shade"></div>
    <div class="latest-content">
      <span class="badge">Latest Video</span>
      <h1 id="latestTitle">Loading latest video…</h1>
      <p id="latestMeta">Please wait</p>
      <button class="play-main" id="latestPlay">▶ Play Video</button>
    </div>
  </section>

  <div class="search-wrap" id="searchWrap">
    <input id="searchInput" class="search" type="search" placeholder="Search videos...">
  </div>

  <nav class="categories" id="categories">
    <button class="cat active" data-category="All">All</button>
    <button class="cat" data-category="Porn Video">Porn Video</button>
    <button class="cat" data-category="Desi Video">Desi Video</button>
    <button class="cat" data-category="Viral Video">Viral Video</button>
  </nav>

  <div class="section-head">
    <h2 id="sectionTitle">All Videos</h2>
    <span id="videoCount">0 videos</span>
  </div>

  <section class="grid" id="videoGrid"></section>
</main>

<section class="profile" id="profilePage">
  <div class="profile-card">
    <img id="profileLogo" class="profile-logo" alt="Logo">
    <h2>P**** Video Hub</h2>
    <p>Your video library</p>
    <div class="stats">
      <div class="stat"><b id="favCount">0</b><span>Favorites</span></div>
      <div class="stat"><b id="historyCount">0</b><span>History</span></div>
    </div>
  </div>
</section>

<!-- VIDEO PLAYER -->
<section class="player-modal" id="playerModal">
  <div class="player-top">
    <button class="close-player" id="closePlayer">×</button>
    <div class="player-title" id="playerTitle">Video</div>
  </div>

  <div class="player-area">
    <video id="mainVideo" controls playsinline preload="metadata"></video>
  </div>

  <div class="player-info">
    <div class="player-actions">
      <button class="action" id="likeBtn">♡ Favorite</button>
      <button class="action" id="shareBtn">↗ Share</button>
      <button class="action" id="fullscreenBtn">⛶ Fullscreen</button>
    </div>
    <p class="player-desc" id="playerDesc"></p>
  </div>
</section>

<nav class="bottom-nav">
  <button class="nav-item active" id="homeNav"><b>⌂</b>Home</button>
  <button class="nav-item" id="searchNav"><b>⌕</b>Search</button>
  <button class="nav-item" id="profileNav"><b>◉</b>Profile</button>
</nav>
