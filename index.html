<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Video Hub</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080b12;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:75px;
}

button,input{
  font:inherit;
}

.app{
  max-width:760px;
  margin:auto;
}

/* HEADER */

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  background:#080b12;
  border-bottom:1px solid #1d2330;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logoIcon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,#ff315f,#7048ff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.logoText{
  font-size:19px;
  font-weight:bold;
}

.logoSub{
  color:#858ea1;
  font-size:11px;
  margin-top:2px;
}

.searchBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#171c27;
  color:#fff;
  font-size:22px;
}

/* SEARCH */

.searchBox{
  display:none;
  padding:10px 14px;
}

.searchBox input{
  width:100%;
  border:1px solid #293040;
  background:#111620;
  color:#fff;
  outline:none;
  border-radius:13px;
  padding:13px 15px;
}

/* SECTIONS */

.section{
  padding:0 14px;
  margin-top:20px;
}

.sectionTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  flex-shrink:0;
  border:1px solid #292f3d;
  background:#111620;
  color:#aeb6c6;
  border-radius:20px;
  padding:9px 15px;
}

.cat.active{
  background:#7048ff;
  border-color:#7048ff;
  color:#fff;
}

/* VIDEO GRID */

.videoGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.card{
  background:#111620;
  border:1px solid #202735;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#151922;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.thumb video{
  display:none;
}

.fallbackThumb{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#171d2a,#32245e);
  font-size:34px;
}

.play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:45px;
  height:45px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.70);
  border:1px solid rgba(255,255,255,.3);
  font-size:18px;
  pointer-events:none;
}

.videoNumber{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 7px;
  border-radius:6px;
  background:rgba(0,0,0,.7);
  font-size:10px;
}

.cardInfo{
  padding:10px;
}

.cardTitle{
  font-size:13px;
  font-weight:bold;
  line-height:1.35;
}

.cardMeta{
  color:#7e8799;
  font-size:11px;
  margin-top:5px;
}

/* PLAYER PAGE */

.playerPage{
  display:none;
  padding-bottom:20px;
}

.playerTop{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
}

.backBtn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#202632;
  color:#fff;
  font-size:22px;
}

.playerTopTitle{
  font-size:17px;
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.playerBox{
  width:100%;
  background:#000;
}

.playerBox video{
  width:100%;
  display:block;
  background:#000;
  max-height:75vh;
}

.playerDetails{
  padding:15px;
}

.playerDetails h2{
  font-size:20px;
}

.playerDetails p{
  margin-top:6px;
  color:#8992a4;
  font-size:13px;
}

/* SUGGESTIONS */

.suggestSection{
  padding:0 14px;
  margin-top:10px;
}

.suggestTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.suggestGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.suggestCard{
  background:#111620;
  border:1px solid #202735;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
}

.suggestThumb{
  aspect-ratio:16/9;
  background:linear-gradient(135deg,#171d2a,#32245e);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.suggestInfo{
  padding:8px;
}

.suggestInfo strong{
  font-size:12px;
}

.suggestInfo small{
  display:block;
  color:#7e8799;
  margin-top:4px;
}

/* PROFILE */

.profile{
  display:none;
  padding:35px 15px;
  text-align:center;
}

.profileAvatar{
  width:78px;
  height:78px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff315f,#7048ff);
  font-size:27px;
  font-weight:bold;
}

.profile h2{
  margin-top:15px;
}

.profile p{
  color:#8790a2;
  margin-top:6px;
  font-size:13px;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  color:#788194;
  padding:50px 10px;
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:66px;
  background:#0c1018;
  border-top:1px solid #202633;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:500;
}

.navItem{
  min-width:65px;
  text-align:center;
  color:#737c90;
  font-size:11px;
  cursor:pointer;
}

.navIcon{
  font-size:21px;
  line-height:25px;
}

.navItem.active{
  color:#fff;
}

/* MOBILE */

@media(max-width:380px){

  .videoGrid,
  .suggestGrid{
    gap:8px;
  }

  .cardTitle{
    font-size:12px;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

  <div class="logo">

    <div class="logoIcon">
      VI
    </div>

    <div>
      <div class="logoText">
        Video Hub
      </div>

      <div class="logoSub">
        Watch your favorite videos
      </div>
    </div>

  </div>

  <button class="searchBtn" onclick="toggleSearch()">
    ⌕
  </button>

</header>


<!-- SEARCH -->

<div class="searchBox" id="searchBox">

  <input
    id="searchInput"
    type="text"
    placeholder="Search videos..."
    oninput="searchVideos()"
  >

</div>


<!-- HOME PAGE -->

<main id="homePage">

  <!-- CATEGORIES -->

  <section class="section">

    <div class="sectionTitle">
      Categories
    </div>

    <div class="categories">

      <button
        class="cat active"
        onclick="filterCategory('All',this)"
      >
        All
      </button>

      <button
        class="cat"
        onclick="filterCategory('Drama',this)"
      >
        Drama
      </button>

      <button
        class="cat"
        onclick="filterCategory('Movies',this)"
      >
        Movies
      </button>

      <button
        class="cat"
        onclick="filterCategory('Sports',this)"
      >
        Sports
      </button>

      <button
        class="cat"
        onclick="filterCategory('Music',this)"
      >
        Music
      </button>

      <button
        class="cat"
        onclick="filterCategory('News',this)"
      >
        News
      </button>

    </div>

  </section>


  <!-- VIDEOS -->

  <section class="section">

    <div class="sectionTitle">
      Latest Videos
    </div>

    <div
      class="videoGrid"
      id="videoGrid"
    ></div>

    <div
      class="empty"
      id="empty"
    >
      No videos found.
    </div>

  </section>

</main>


<!-- PLAYER PAGE -->

<section
  class="playerPage"
  id="playerPage"
>

  <div class="playerTop">

    <button
      class="backBtn"
      onclick="closePlayer()"
    >
      ←
    </button>

    <div
      class="playerTopTitle"
      id="playerTopTitle"
    >
      Video
    </div>

  </div>


  <!-- VIDEO PLAYER -->

  <div class="playerBox">

    <video
      id="mainVideo"
      controls
      playsinline
      preload="metadata"
    ></video>

  </div>


  <!-- VIDEO INFO -->

  <div class="playerDetails">

    <h2 id="playerTitle">
      Video
    </h2>

    <p>
      Enjoy watching on Video Hub.
    </p>

  </div>


  <!-- SUGGESTED VIDEOS -->

  <section class="suggestSection">

    <div class="suggestTitle">
      Suggested Videos
    </div>

    <div
      class="suggestGrid"
      id="suggestGrid"
    ></div>

  </section>

</section>


<!-- PROFILE -->

<section
  class="profile"
  id="profilePage"
>

  <div class="profileAvatar">
    VI
  </div>

  <h2>
    Video Hub User
  </h2>

  <p>
    Your Telegram Video Hub profile
  </p>

</section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottomNav">

  <div
    class="navItem active"
    onclick="showHome(this)"
  >

    <div class="navIcon">
      ⌂
    </div>

    Home

  </div>


  <div
    class="navItem"
    onclick="showTrending(this)"
  >

    <div class="navIcon">
      🔥
    </div>

    Trending

  </div>


  <div
    class="navItem"
    onclick="showFavorites(this)"
  >

    <div class="navIcon">
      ♡
    </div>

    Favorites

  </div>


  <div
    class="navItem"
    onclick="showProfile(this)"
  >

    <div class="navIcon">
      ●
    </div>

    Profile

  </div>

</nav>


<script>

/* TELEGRAM */

const tg =
  window.Telegram &&
  window.Telegram.WebApp;

if(tg){

  tg.ready();

  tg.expand();

}


/*
================================================
VIDEO DATABASE
================================================

এখানে পরে শুধু নতুন video URL যোগ করবে।

================================================
*/

const videos = [

  {
    id:1,
    title:"Video Episode 1",
    category:"Drama",
    url:"https://files.catbox.moe/54pjw2.mp4"
  },

  {
    id:2,
    title:"Video Episode 2",
    category:"Drama",
    url:"https://files.catbox.moe/nfjfar.mp4"
  }

];


/*
================================================
HOME CARDS
================================================
*/

function createCards(){

  const grid =
    document.getElementById("videoGrid");

  grid.innerHTML="";

  videos.forEach((video,index)=>{

    const card =
      document.createElement("div");

    card.className =
      "card videoCard";

    card.dataset.title =
      video.title.toLowerCase();

    card.dataset.category =
      video.category;

    card.innerHTML = `

      <div class="thumb">

        <div class="fallbackThumb">
          🎬
        </div>

        <video
          muted
          preload="metadata"
          playsinline
          src="${video.url}"
        ></video>

        <div class="play">
          ▶
        </div>

        <div class="videoNumber">
          #${index+1}
        </div>

      </div>

      <div class="cardInfo">

        <div class="cardTitle">
          ${escapeHTML(video.title)}
        </div>

        <div class="cardMeta">
          ${escapeHTML(video.category)} • HD
        </div>

      </div>

    `;


    /*
    ভিডিও থেকে thumbnail frame
    নেওয়ার চেষ্টা।
    */

    const previewVideo =
      card.querySelector("video");

    const fallback =
      card.querySelector(".fallbackThumb");


    previewVideo.addEventListener(
      "loadedmetadata",
      function(){

        /*
        ভিডিওর প্রায় 20% জায়গার
        frame নেওয়ার চেষ্টা।

        এটি নির্দিষ্ট 'best moment'
        AI দিয়ে নির্বাচন নয়।
        */

        let time = 3;

        if(
          previewVideo.duration &&
          isFinite(previewVideo.duration)
        ){

          time =
            Math.max(
              0.5,
              Math.min(
                previewVideo.duration * 0.2,
                previewVideo.duration - 0.5
              )
            );

        }

        previewVideo.currentTime =
          time;

      }
    );


    previewVideo.addEventListener(
      "seeked",
      function(){

        try{

          const canvas =
            document.createElement("canvas");

          canvas.width=640;
          canvas.height=360;

          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            previewVideo,
            0,
            0,
            640,
            360
          );

          const image =
            canvas.toDataURL(
              "image/jpeg",
              0.75
            );

          fallback.style.backgroundImage =
            `url(${image})`;

          fallback.style.backgroundSize =
            "cover";

          fallback.style.backgroundPosition =
            "center";

          fallback.textContent="";

        }catch(error){

          /*
          CORS বন্ধ থাকলে
          fallback 🎬 থাকবে।
          */

        }

      }
    );


    card.onclick=function(){

      openPlayer(index);

    };


    grid.appendChild(card);

  });

}


/*
================================================
OPEN PLAYER
================================================
*/

function openPlayer(index){

  const video =
    videos[index];

  document.getElementById("homePage")
    .style.display="none";

  document.getElementById("profilePage")
    .style.display="none";

  document.getElementById("playerPage")
    .style.display="block";

  document.getElementById("playerTopTitle")
    .textContent =
    video.title;

  document.getElementById("playerTitle")
    .textContent =
    video.title;

  const player =
    document.getElementById("mainVideo");

  player.pause();

  player.src =
    video.url;

  player.load();

  /*
  User নিজে play করবে।
  */

  createSuggestions(index);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/*
================================================
SUGGESTED VIDEOS
================================================
*/

function createSuggestions(currentIndex){

  const grid =
    document.getElementById("suggestGrid");

  grid.innerHTML="";

  videos.forEach((video,index)=>{

    if(index===currentIndex){
      return;
    }

    const card =
      document.createElement("div");

    card.className =
      "suggestCard";

    card.innerHTML = `

      <div class="suggestThumb">
        ▶
      </div>

      <div class="suggestInfo">

        <strong>
          ${escapeHTML(video.title)}
        </strong>

        <small>
          ${escapeHTML(video.category)} • HD
        </small>

      </div>

    `;

    card.onclick=function(){

      openPlayer(index);

    };

    grid.appendChild(card);

  });

}


/*
================================================
CLOSE PLAYER
================================================
*/

function closePlayer(){

  const player =
    document.getElementById("mainVideo");

  player.pause();

  player.removeAttribute("src");

  player.load();

  document.getElementById("playerPage")
    .style.display="none";

  document.getElementById("homePage")
    .style.display="block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/*
================================================
SEARCH
================================================
*/

function toggleSearch(){

  const box =
    document.getElementById("searchBox");

  if(box.style.display==="block"){

    box.style.display="none";

  }else{

    box.style.display="block";

    document
      .getElementById("searchInput")
      .focus();

  }

}


function searchVideos(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const cards =
    document.querySelectorAll(".videoCard");

  let found=0;

  cards.forEach(card=>{

    if(
      card.dataset.title
      .includes(query)
    ){

      card.style.display="block";

      found++;

    }else{

      card.style.display="none";

    }

  });

  document.getElementById("empty")
    .style.display =
    found===0
    ? "block"
    : "none";

}


/*
================================================
CATEGORY
================================================
*/

function filterCategory(
  category,
  button
){

  document
    .querySelectorAll(".cat")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  const cards =
    document.querySelectorAll(".videoCard");

  let found=0;

  cards.forEach(card=>{

    if(
      category==="All" ||
      card.dataset.category===category
    ){

      card.style.display="block";

      found++;

    }else{

      card.style.display="none";

    }

  });

  document.getElementById("empty")
    .style.display =
    found===0
    ? "block"
    : "none";

}


/*
================================================
NAVIGATION
================================================
*/

function setActiveNav(nav){

  document
    .querySelectorAll(".navItem")
    .forEach(item=>{
      item.classList.remove("active");
    });

  nav.classList.add("active");

}


function showHome(nav){

  document.getElementById("homePage")
    .style.display="block";

  document.getElementById("playerPage")
    .style.display="none";

  document.getElementById("profilePage")
    .style.display="none";

  setActiveNav(nav);

}


function showTrending(nav){

  showHome(nav);

  window.scrollTo({
    top:300,
    behavior:"smooth"
  });

}


function showFavorites(nav){

  setActiveNav(nav);

  alert(
    "Favorites system will be added later."
  );

}


function showProfile(nav){

  document.getElementById("homePage")
    .style.display="none";

  document.getElementById("playerPage")
    .style.display="none";

  document.getElementById("profilePage")
    .style.display="block";

  setActiveNav(nav);

}


/*
================================================
ESCAPE
================================================
*/

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Escape"){
      closePlayer();
    }

  }
);


/*
================================================
SAFE TEXT
================================================
*/

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/*
================================================
START
================================================
*/

createCards();

</script>

</body>
</html>
