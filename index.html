<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>Video Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#07060b;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:76px}
button{font:inherit}
.app{max-width:1180px;margin:auto}

/* TOP BAR */
.topbar{
  height:66px;padding:8px 15px;display:flex;align-items:center;gap:11px;
  background:#0b0910;border-bottom:1px solid #201a29;
  position:sticky;top:0;z-index:20
}
.logo{
  width:46px;height:46px;border-radius:50%;object-fit:cover;
  border:2px solid #b84cff;box-shadow:0 0 15px #7d25a855
}
.brand{font-size:19px;font-weight:800}
.brand small{display:block;font-size:11px;color:#aaa3b4;margin-top:3px}
.spacer{flex:1}
.search{
  width:42px;height:42px;border-radius:50%;border:1px solid #2b2237;
  background:#17111f;color:#fff;font-size:21px
}

/* HOME */
main{padding:14px}
.hero{
  position:relative;min-height:285px;border-radius:23px;overflow:hidden;
  border:1px solid #2b2036;background:#0d0a11
}
.hero img{
  width:100%;height:285px;object-fit:cover;display:block;
  filter:brightness(.52)
}
.hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,#07060b 0%,transparent 62%),
             linear-gradient(90deg,rgba(0,0,0,.7),transparent 70%)
}
.hero-content{position:absolute;z-index:2;left:20px;right:20px;bottom:20px}
.badge{
  display:inline-block;padding:6px 11px;border-radius:20px;
  background:#7d28d9;color:#fff;font-size:11px;font-weight:800
}
.hero h1{font-size:25px;margin:10px 0 6px}
.hero p{margin:0 0 13px;color:#c6bdcf;font-size:12px}
.watch{
  background:linear-gradient(135deg,#d347ff,#7629ff);border:0;color:white;
  padding:11px 17px;border-radius:12px;font-weight:800
}

/* CATEGORIES */
.categories{
  display:flex;gap:8px;overflow-x:auto;padding:14px 0 11px;
  scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;padding:10px 16px;border-radius:13px;
  background:#15111c;border:1px solid #292132;color:#c5bdce;font-weight:700
}
.cat.active{
  background:linear-gradient(135deg,#c83eff,#7526f5);color:#fff;border-color:transparent;
  box-shadow:0 7px 20px #7c2cff33
}
.heading{display:flex;justify-content:space-between;align-items:center;margin:5px 0 12px}
.heading h2{font-size:18px;margin:0}
.heading span{font-size:11px;color:#aaa2b1}

/* VIDEO GRID */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{min-width:0}
.thumb{
  position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:12px;
  background:#15101d;border:1px solid #282031
}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:43px;height:43px;border-radius:50%;display:grid;place-items:center;
  background:#0009;border:1px solid #fff8;font-size:18px
}
.duration{
  position:absolute;right:6px;bottom:6px;padding:3px 6px;
  border-radius:5px;background:#000b;font-size:10px
}
.card h3{
  font-size:12px;line-height:1.35;margin:7px 2px 3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.meta{font-size:10px;color:#9f97a8;margin:0 2px}

/* BOTTOM */
.bottom{
  position:fixed;left:0;right:0;bottom:0;height:70px;z-index:30;
  background:#0b0910eF;border-top:1px solid #211a2a;
  display:flex;justify-content:space-around;align-items:center;
  backdrop-filter:blur(14px)
}
.nav{
  border:0;background:none;color:#89818f;font-size:10px;text-align:center
}
.nav b{display:block;font-size:20px;margin-bottom:4px}
.nav.active{color:#d46bff}

/* PLAYER */
.player{
  position:fixed;inset:0;background:#000;z-index:100;display:none;
  flex-direction:column
}
.player.open{display:flex}
.playerbar{
  height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:#0b0910
}
.close{
  width:40px;height:40px;border:0;border-radius:50%;background:#1a1420;color:#fff;font-size:23px
}
.ptitle{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-area{
  flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000
}
video#playerVideo{width:100%;height:auto;max-height:calc(100vh - 120px);object-fit:contain}
.player-actions{
  display:flex;gap:8px;padding:10px 12px;background:#0b0910
}
.act{padding:9px 12px;border-radius:10px;border:1px solid #2b2334;background:#17111f;color:#fff;font-size:12px}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <!-- STEP 1: logo will be replaced by the final uploaded logo asset -->
    <div class="logo" style="display:grid;place-items:center;font-size:10px">APP</div>
    <div class="brand">Video Hub<small>Telegram Mini App</small></div>
    <div class="spacer"></div>
    <button class="search">⌕</button>
  </header>

  <main>
    <section class="hero">
      <img src="https://yourimageshare.com/ib/GlV2dL5IWO.jpg" alt="Featured">
      <div class="hero-content">
        <span class="badge">LATEST VIDEO</span>
        <h1 id="latestTitle">Latest Video</h1>
        <p id="latestMeta">Loading videos…</p>
        <button class="watch" id="latestBtn">▶ Watch Now</button>
      </div>
    </section>

    <nav class="categories">
      <button class="cat active" data-cat="All">All</button>
      <button class="cat" data-cat="Porn Video">Porn Video</button>
      <button class="cat" data-cat="Desi Video">Desi Video</button>
      <button class="cat" data-cat="Viral Video">Viral Video</button>
    </nav>

    <div class="heading">
      <h2>Latest Videos</h2>
      <span id="count">0 videos</span>
    </div>

    <section class="grid" id="grid"></section>
  </main>
</div>

<nav class="bottom">
  <button class="nav active"><b>⌂</b>Home</button>
  <button class="nav"><b>⌕</b>Search</button>
  <button class="nav"><b>♡</b>Favorites</button>
  <button class="nav"><b>◉</b>Profile</button>
</nav>

<section class="player" id="player">
  <div class="playerbar">
    <button class="close" id="close">×</button>
    <div class="ptitle" id="ptitle">Video</div>
  </div>
  <div class="video-area">
    <video id="playerVideo" controls playsinline preload="metadata"></video>
  </div>
  <div class="player-actions">
    <button class="act" id="fullscreen">⛶ Fullscreen</button>
    <button class="act" id="share">↗ Share</button>
  </div>
</section>

<script>
const DATA_URL="./videos.json";
let videos=[];
let active="All";
let current=null;

async function loadVideos(){
  const res=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
  if(!res.ok) throw new Error("videos.json not found");
  const data=await res.json();
  videos=Array.isArray(data)?data:(data.videos||[]);
  videos=videos.filter(v=>v&&v.url);
  render();
}

function render(){
  const list=active==="All"?videos:videos.filter(v=>v.category===active);
  document.getElementById("count").textContent=list.length+" videos";

  if(videos.length){
    const latest=videos[videos.length-1];
    document.getElementById("latestTitle").textContent=latest.title||"Latest Video";
    document.getElementById("latestMeta").textContent=(latest.category||"Video")+" • "+(latest.views||0)+" views";
    document.getElementById("latestBtn").onclick=()=>openVideo(latest);
  }

  const grid=document.getElementById("grid");
  grid.innerHTML="";
  list.forEach(v=>{
    const card=document.createElement("article");
    card.className="card";
    const th=document.createElement("div");
    th.className="thumb";

    if(v.thumbnail){
      const img=document.createElement("img");
      img.src=v.thumbnail;
      img.loading="lazy";
      th.appendChild(img);
    }else{
      const vid=document.createElement("video");
      vid.src=v.url;vid.muted=true;vid.playsInline=true;vid.preload="metadata";
      th.appendChild(vid);
    }

    const play=document.createElement("div");
    play.className="play";play.textContent="▶";
    th.appendChild(play);

    if(v.duration){
      const d=document.createElement("span");
      d.className="duration";d.textContent=v.duration;th.appendChild(d);
    }

    card.appendChild(th);
    const h=document.createElement("h3");h.textContent=v.title||"Video";card.appendChild(h);
    const m=document.createElement("p");m.className="meta";m.textContent=(v.category||"Video")+" • "+(v.views||0)+" views";card.appendChild(m);
    card.onclick=()=>openVideo(v);
    grid.appendChild(card);
  });
}

function openVideo(v){
  current=v;
  document.getElementById("ptitle").textContent=v.title||"Video";
  const player=document.getElementById("playerVideo");
  player.src=v.url;
  player.load();
  document.getElementById("player").classList.add("open");
  player.play().catch(()=>{});
}

document.getElementById("close").onclick=()=>{
  const p=document.getElementById("playerVideo");
  p.pause();p.removeAttribute("src");p.load();
  document.getElementById("player").classList.remove("open");
};

document.getElementById("fullscreen").onclick=async()=>{
  const p=document.getElementById("playerVideo");
  if(document.fullscreenElement){await document.exitFullscreen();return}
  if(p.requestFullscreen) await p.requestFullscreen();
  else if(p.webkitRequestFullscreen) p.webkitRequestFullscreen();
  else if(p.webkitEnterFullscreen) p.webkitEnterFullscreen();
};

document.getElementById("share").onclick=async()=>{
  if(!current)return;
  const url=location.origin+location.pathname+"?video="+encodeURIComponent(current.id||"");
  if(navigator.share) await navigator.share({title:current.title||"Video",url});
  else{
    await navigator.clipboard.writeText(url);
    alert("Link copied");
  }
};

document.querySelectorAll(".cat").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    active=btn.dataset.cat;
    render();
  };
});

loadVideos().catch(err=>{
  document.getElementById("latestTitle").textContent="Videos not loaded";
  document.getElementById("latestMeta").textContent="Keep videos.json beside index.html";
  console.error(err);
});
</script>
</body>
</html>
