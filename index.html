<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>P**** Video Hub</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07080c;
  --surface:#10121a;
  --surface2:#171a24;
  --surface3:#202432;
  --text:#fff;
  --muted:#8f95a6;
  --border:rgba(255,255,255,.08);
  --accent:#766cff;
  --accent2:#9b91ff;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

.app{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding-bottom:88px;
}


/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  padding:12px 14px 10px;
  background:rgba(7,8,12,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  object-fit:cover;
  background:var(--surface2);
  border:1px solid var(--border);
}

.brand-name{
  font-size:18px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-name span{
  color:var(--accent2);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--surface2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}


/* ================= SEARCH ================= */

.search-box{
  position:relative;
  margin-top:12px;
}

.search-box input{
  width:100%;
  height:44px;
  padding:0 16px 0 44px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  color:#fff;
  outline:none;
}

.search-box input:focus{
  border-color:rgba(118,108,255,.65);
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}


/* ================= HERO ================= */

.hero{
  margin:14px;
  position:relative;
  min-height:205px;
  border-radius:20px;
  overflow:hidden;
  background:var(--surface2);
  border:1px solid var(--border);
}

.hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.72;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(7,8,12,.96) 0%,
      rgba(7,8,12,.62) 48%,
      rgba(7,8,12,.18) 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;
  min-height:205px;
  padding:25px 20px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-start;
}

.hero-badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  background:rgba(118,108,255,.2);
  border:1px solid rgba(155,145,255,.3);
  color:#c9c4ff;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
}

.hero-title{
  margin-top:9px;
  font-size:24px;
  font-weight:900;
}

.hero-subtitle{
  margin-top:6px;
  color:#c0c4cf;
  font-size:12px;
}

.hero-button{
  margin-top:14px;
  padding:10px 17px;
  border-radius:11px;
  background:var(--accent);
  font-weight:800;
  font-size:13px;
}


/* ================= CATEGORIES ================= */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 14px 5px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:none;
  padding:9px 15px;
  border-radius:22px;
  background:var(--surface);
  border:1px solid var(--border);
  color:#aeb3c0;
  font-size:12px;
}

.category.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}


/* ================= SECTIONS ================= */

.section{
  padding:20px 14px 0;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-head h2{
  font-size:18px;
}

.section-head span{
  color:var(--muted);
  font-size:11px;
}


/* ================= VIDEO GRID ================= */

.video-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
}

.video-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:transform .18s,border-color .18s;
}

.video-card:active{
  transform:scale(.975);
}

.thumbnail{
  position:relative;
  aspect-ratio:16/9;
  background:#191c25;
  overflow:hidden;
}

.thumbnail img,
.thumbnail video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.thumbnail video{
  pointer-events:none;
}

.thumb-fallback{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#181b25,#292d3b);
  font-size:28px;
}

.play-circle{
  position:absolute;
  left:10px;
  bottom:9px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  backdrop-filter:blur(5px);
}

.duration{
  position:absolute;
  right:8px;
  bottom:8px;
  padding:4px 6px;
  border-radius:5px;
  background:rgba(0,0,0,.78);
  color:#fff;
  font-size:10px;
}

.card-body{
  padding:9px;
}

.card-title{
  font-size:13px;
  font-weight:750;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
  color:var(--muted);
  font-size:10px;
}

.card-category{
  color:#aaa3ff;
}


/* ================= PLAYER ================= */

.player-page{
  display:none;
}

.player-page.active{
  display:block;
}

.home-page.hidden{
  display:none;
}

.back-row{
  padding:14px;
}

.back-btn{
  padding:9px 14px;
  border-radius:10px;
  background:var(--surface);
  border:1px solid var(--border);
}

.player-wrap{
  padding:0 10px;
}

.player{
  width:100%;
  background:#000;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--border);
}

.player video{
  width:100%;
  display:block;
  aspect-ratio:16/9;
  background:#000;
  object-fit:contain;
}

.player-details{
  padding:15px 4px;
}

.player-title{
  font-size:20px;
  font-weight:900;
}

.player-meta{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.player-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.player-action{
  flex:1;
  min-height:42px;
  border-radius:11px;
  background:var(--surface2);
  border:1px solid var(--border);
  font-size:12px;
}

.player-action.active{
  color:#aaa3ff;
  border-color:rgba(118,108,255,.45);
}

.description{
  margin-top:13px;
  padding:13px;
  border-radius:13px;
  background:var(--surface);
  border:1px solid var(--border);
  color:#b9bdc9;
  font-size:12px;
  line-height:1.6;
}


/* ================= SUGGESTED ================= */

.suggested{
  padding:5px 14px 30px;
}

.suggested-title{
  font-size:17px;
  font-weight:800;
  margin:16px 0 12px;
}

.suggested-item{
  display:flex;
  gap:10px;
  padding:7px;
  margin-bottom:9px;
  border-radius:12px;
  background:var(--surface);
  border:1px solid var(--border);
}

.suggested-thumb{
  width:112px;
  aspect-ratio:16/9;
  flex:none;
  border-radius:8px;
  overflow:hidden;
  background:#1b1e27;
}

.suggested-thumb img,
.suggested-thumb video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.suggested-info{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.suggested-info strong{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.suggested-info span{
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
}


/* ================= EMPTY / ERROR ================= */

.empty,
.error-box,
.loading{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
  font-size:13px;
}

.error-box{
  display:none;
  color:#ff9ba8;
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:1000px;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(12,13,19,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
}

.nav-btn{
  min-width:60px;
  background:none;
  color:#777d8d;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
}

.nav-icon{
  font-size:20px;
  line-height:1;
}

.nav-btn.active{
  color:#aaa3ff;
}


/* ================= RESPONSIVE ================= */

@media(max-width:600px){

  .hero{
    min-height:195px;
  }

  .hero-content{
    min-height:195px;
  }

  .hero-title{
    font-size:21px;
  }

  .video-grid{
    gap:8px;
  }

  .card-body{
    padding:8px;
  }

  .card-title{
    font-size:12px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- ================= HOME ================= -->

<div id="homePage" class="home-page">


<header class="header">

  <div class="header-row">

    <div class="brand">

      <img
        id="appLogo"
        class="logo"
        src="https://yourimageshare.com/ib/GlV2dL5IWO.jpg"
        alt="P**** Video Hub">

      <div class="brand-name">
        P**** <span>Video Hub</span>
      </div>

    </div>


    <div class="header-actions">

      <button
        class="icon-btn"
        onclick="showProfile()">
        👤
      </button>

    </div>

  </div>


  <div class="search-box">

    <span class="search-icon">🔎</span>

    <input
      id="searchInput"
      type="search"
      placeholder="Search videos..."
      autocomplete="off">

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <img
    id="heroImage"
    class="hero-bg"
    src="https://yourimageshare.com/ib/GlV2dL5IWO.jpg"
    alt="Featured">

  <div class="hero-overlay"></div>

  <div class="hero-content">

    <div class="hero-badge">
      Featured
    </div>

    <div class="hero-title">
      Watch Latest Videos
    </div>

    <div class="hero-subtitle">
      Discover the latest videos in one place.
    </div>

    <button
      class="hero-button"
      onclick="scrollToVideos()">
      ▶ Explore Videos
    </button>

  </div>

</section>


<!-- CATEGORIES -->

<div
  id="categories"
  class="categories">

  <button
    class="category active"
    onclick="filterCategory('All',this)">
    All
  </button>

  <button
    class="category"
    onclick="filterCategory('Category 1',this)">
    Category 1
  </button>

  <button
    class="category"
    onclick="filterCategory('Category 2',this)">
    Category 2
  </button>

  <button
    class="category"
    onclick="filterCategory('Category 3',this)">
    Category 3
  </button>

</div>


<!-- LATEST -->

<section
  id="videosSection"
  class="section">

  <div class="section-head">

    <h2>
      Latest Videos
    </h2>

    <span id="videoCount">
      0 videos
    </span>

  </div>


  <div
    id="videoGrid"
    class="video-grid">
  </div>


  <div
    id="loading"
    class="loading">
    Loading videos...
  </div>


  <div
    id="empty"
    class="empty"
    style="display:none;">
    No videos found.
  </div>


  <div
    id="errorBox"
    class="error-box">
    Unable to load videos. Please try again.
  </div>

</section>


</div>


<!-- ================= PLAYER ================= -->

<div
  id="playerPage"
  class="player-page">


  <div class="back-row">

    <button
      class="back-btn"
      onclick="closePlayer()">
      ← Back
    </button>

  </div>


  <div class="player-wrap">


    <div class="player">

      <video
        id="mainVideo"
        controls
        playsinline
        preload="metadata">
      </video>

    </div>


    <div class="player-details">

      <div
        id="playerTitle"
        class="player-title">
        Video
      </div>


      <div
        id="playerMeta"
        class="player-meta">
        Category
      </div>


      <div class="player-actions">

        <button
          id="likeBtn"
          class="player-action"
          onclick="toggleLike()">
          👍 Like
        </button>

        <button
          id="favoriteBtn"
          class="player-action"
          onclick="toggleFavorite()">
          ♡ Favorite
        </button>

        <button
          class="player-action"
          onclick="shareCurrentVideo()">
          ↗ Share
        </button>

      </div>


      <div
        id="description"
        class="description">
        Video information
      </div>

    </div>

  </div>


  <div class="suggested">

    <div class="suggested-title">
      Suggested Videos
    </div>

    <div
      id="suggestedList">
    </div>

  </div>


</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="goHome()">

    <span class="nav-icon">⌂</span>
    Home

  </button>


  <button
    class="nav-btn"
    onclick="focusSearch()">

    <span class="nav-icon">⌕</span>
    Search

  </button>


  <button
    class="nav-btn"
    onclick="showFavorites()">

    <span class="nav-icon">♡</span>
    Favorites

  </button>


  <button
    class="nav-btn"
    onclick="showProfile()">

    <span class="nav-icon">◉</span>
    Profile

  </button>

</nav>


</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
  window.Telegram?.WebApp || null;

if(tg){

  tg.ready();

  tg.expand();

  if(tg.setHeaderColor){
    tg.setHeaderColor("#07080c");
  }

  if(tg.setBackgroundColor){
    tg.setBackgroundColor("#07080c");
  }

}


/* =====================================================
   APP CONFIG
===================================================== */

const VIDEOS_FILE = "./videos.json";

const APP_NAME = "P**** Video Hub";


/* =====================================================
   DATA
===================================================== */

let videos = [];

let currentCategory = "All";

let currentVideoId = null;

let likedVideos =
  JSON.parse(
    localStorage.getItem("likedVideos") || "[]"
  );

let favoriteVideos =
  JSON.parse(
    localStorage.getItem("favoriteVideos") || "[]"
  );

let watchHistory =
  JSON.parse(
    localStorage.getItem("watchHistory") || "[]"
  );


/* =====================================================
   LOAD VIDEO DATA
===================================================== */

async function loadVideos(){

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("errorBox");

  try{

    loading.style.display = "block";

    errorBox.style.display = "none";


    const response =
      await fetch(
        VIDEOS_FILE + "?v=" + Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "videos.json error: " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        "videos.json must be an array"
      );

    }


    videos =
      data
      .filter(video =>
        video &&
        video.id !== undefined &&
        video.url
      )
      .map(video => ({

        id:String(video.id),

        title:
          video.title ||
          "Untitled Video",

        category:
          video.category ||
          "Other",

        url:
          video.url,

        thumbnail:
          video.thumbnail ||
          "",

        duration:
          video.duration ||
          "",

        views:
          video.views ||
          0,

        description:
          video.description ||
          "No description available."

      }));


    loading.style.display = "none";


    renderVideos();


    openVideoFromTelegram();


  }catch(error){

    console.error(error);

    loading.style.display = "none";

    errorBox.style.display = "block";

    videos = [];

    renderVideos();

  }

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(){

  const grid =
    document.getElementById("videoGrid");

  const empty =
    document.getElementById("empty");

  const count =
    document.getElementById("videoCount");

  const search =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


  const filtered =
    videos.filter(video => {

      const categoryMatch =
        currentCategory === "All" ||
        video.category === currentCategory;


      const searchMatch =
        String(video.title)
        .toLowerCase()
        .includes(search);


      return (
        categoryMatch &&
        searchMatch
      );

    });


  grid.innerHTML = "";


  count.textContent =
    filtered.length + " videos";


  if(filtered.length === 0){

    empty.style.display = "block";

    return;

  }


  empty.style.display = "none";


  filtered.forEach(video => {

    grid.appendChild(
      createVideoCard(video)
    );

  });

}


/* =====================================================
   CREATE VIDEO CARD
===================================================== */

function createVideoCard(video){

  const card =
    document.createElement("article");

  card.className =
    "video-card";


  card.onclick = () => {

    openPlayer(video.id);

  };


  const thumbnail =
    video.thumbnail
    ? `
      <img
        src="${escapeHTML(video.thumbnail)}"
        alt=""
        loading="lazy">
      `
    : `
      <video
        muted
        playsinline
        preload="metadata"
        src="${escapeHTML(video.url)}">
      </video>
    `;


  card.innerHTML = `

    <div class="thumbnail">

      <div class="thumb-fallback">
        🎬
      </div>

      ${thumbnail}

      <div class="play-circle">
        ▶
      </div>

      ${
        video.duration
        ?
        `<div class="duration">
          ${escapeHTML(video.duration)}
        </div>`
        :
        ""
      }

    </div>


    <div class="card-body">

      <div class="card-title">
        ${escapeHTML(video.title)}
      </div>

      <div class="card-meta">

        <span class="card-category">
          ${escapeHTML(video.category)}
        </span>

        ${
          video.views
          ?
          `<span>• ${formatViews(video.views)} views</span>`
          :
          ""
        }

      </div>

    </div>

  `;


  const fallback =
    card.querySelector(".thumb-fallback");


  const media =
    card.querySelector(
      ".thumbnail img, .thumbnail video"
    );


  if(media){

    media.addEventListener(
      "load",
      ()=>{
        fallback.style.display = "none";
      }
    );


    media.addEventListener(
      "loadeddata",
      ()=>{
        fallback.style.display = "none";
      }
    );


    media.addEventListener(
      "error",
      ()=>{
        fallback.style.display = "flex";
      }
    );

  }


  return card;

}


/* =====================================================
   OPEN PLAYER
===================================================== */

function openPlayer(id){

  const video =
    videos.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!video){
    return;
  }


  currentVideoId =
    String(video.id);


  addToHistory(
    video.id
  );


  document
    .getElementById("homePage")
    .classList.add("hidden");


  document
    .getElementById("playerPage")
    .classList.add("active");


  const player =
    document.getElementById("mainVideo");


  player.pause();

  player.src = video.url;

  player.load();


  document
    .getElementById("playerTitle")
    .textContent =
      video.title;


  document
    .getElementById("playerMeta")
    .textContent =
      video.category +
      (
        video.views
        ? " • " +
          formatViews(video.views) +
          " views"
        : ""
      );


  document
    .getElementById("description")
    .textContent =
      video.description;


  updateFavoriteButton();

  updateLikeButton();

  renderSuggested();


  window.scrollTo({
    top:0,
    behavior:"instant"
  });

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer(){

  const player =
    document.getElementById("mainVideo");


  player.pause();

  player.removeAttribute("src");

  player.load();


  document
    .getElementById("playerPage")
    .classList.remove("active");


  document
    .getElementById("homePage")
    .classList.remove("hidden");


  window.scrollTo({
    top:0,

/* =====================================================
   SUGGESTED
===================================================== */

function renderSuggested(){

  const list =
    document.getElementById(
      "suggestedList"
    );


  list.innerHTML = "";


  videos
    .filter(
      video =>
        String(video.id) !==
        String(currentVideoId)
    )
    .slice(0,8)
    .forEach(video => {

      const item =
        document.createElement("div");


      item.className =
        "suggested-item";


      item.onclick =
        () => openPlayer(video.id);


      item.innerHTML = `

        <div class="suggested-thumb">

          ${
            video.thumbnail
            ?
            `<img
              src="${escapeHTML(video.thumbnail)}"
              alt=""
              loading="lazy">`
            :
            `<video
              muted
              playsinline
              preload="metadata"
              src="${escapeHTML(video.url)}">
            </video>`
          }

        </div>


        <div class="suggested-info">

          <strong>
            ${escapeHTML(video.title)}
          </strong>

          <span>
            ${escapeHTML(video.category)}
          </span>

        </div>

      `;


      list.appendChild(item);

    });

}

function addToHistory(id){

  const videoId =
    String(id);


  watchHistory =
    watchHistory.filter(
      item =>
        item !== videoId
    );


  watchHistory.unshift(
    videoId
  );


  watchHistory =
    watchHistory.slice(
      0,
      50
    );


  localStorage.setItem(
    "watchHistory",
    JSON.stringify(
      watchHistory
    )
  );

}

/* =====================================================
   SHARE
===================================================== */

async function shareCurrentVideo(){

  const video =
    videos.find(
      item =>
        String(item.id) ===
        String(currentVideoId)
    );


  if(!video){
    return;
  }


  const username =
    "XVideohub_bd_bot";


  const shareUrl =
    "https://t.me/" +
    username +
    "?startapp=" +
    encodeURIComponent(
      "video_" + video.id
    );


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          video.title,

        text:
          video.title,

        url:
          shareUrl

      });

    }else{

      await navigator.clipboard.writeText(
        shareUrl
      );


      telegramAlert(
        "Video link copied!"
      );

    }

  }catch(error){

    console.log(
      "Share cancelled"
    );

  }

}


/* =====================================================
   TELEGRAM START PARAM
===================================================== */

function getStartParam(){

  if(
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.start_param
  ){

    return String(
      tg.initDataUnsafe.start_param
    );

  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  return (
    params.get(
      "tgWebAppStartParam"
    ) || ""
  );

}


function openVideoFromTelegram(){

  const param =
    getStartParam();


  if(!param){
    return;
  }


  let videoId =
    param;


  if(
    param.startsWith(
      "video_"
    )
  ){

    videoId =
      param.substring(
        6
      );

  }


  const video =
    videos.find(
      item =>
        String(item.id) ===
        String(videoId)
    );


  if(video){

    setTimeout(
      ()=>{
        openPlayer(
          video.id
        );
      },
      350
    );

  }

}

/* =====================================================
   HELPERS
===================================================== */

function formatViews(value){

  const number =
    Number(value) || 0;


  if(number >= 1000000){

    return (
      (number / 1000000)
      .toFixed(1)
      .replace(".0","") +
      "M"
    );

  }


  if(number >= 1000){

    return (
      (number / 1000)
      .toFixed(1)
      .replace(".0","") +
      "K"
    );

  }


  return String(
    number
  );

}


function escapeHTML(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
